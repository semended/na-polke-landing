<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Сладости и напитки с самовывозом. Выберите товары и соберите заказ в магазине «На полке».">
    <title>На полке — магазин сладостей и напитков</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <script>
      const section = window.location.hash;
      if (section.startsWith("#/")) {
        window.location.replace("./mvp/" + section);
      } else if (section) {
        window.location.replace("./about.html" + section);
      } else {
        window.location.replace("./mvp/#/catalog");
      }
    </script>
  </head>
  <body>
    <main>
      <h1>На полке</h1>
      <p><a href="./mvp/#/catalog">Открыть магазин</a></p>
      <noscript>
        <p>Для корзины нужен JavaScript. В <a href="./about.html#selection">статическом каталоге</a> можно посмотреть товары, цены и состав коллекции.</p>
      </noscript>
    </main>
  </body>
</html>
